<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI 测试 · macOS 毛玻璃</title>
    <!-- 引入 Tailwind CSS (支持任意值) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 自定义额外样式（补全 Tailwind 未覆盖的细节） -->
    <style>
        /* 全局字体和基础重置 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1c1c1e;
            color: rgba(255, 255, 255, 0.95);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 衬线标题 */
        .font-serif {
            font-family: Georgia, "Times New Roman", serif;
        }

        /* 等宽代码 */
        .font-mono {
            font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
        }

        /* 所有过渡仅作用于颜色，克制且平滑 */
        * {
            transition-property: background-color, border-color, color, fill, stroke;
            transition-duration: 200ms;
            transition-timing-function: ease-out;
        }

        /* 自定义滚动条（可选） */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1c1c1e;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3a3c;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4c;
        }

        /* 确保卡片内列表样式统一 */
        .card-list li {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.875rem;
            line-height: 1.6;
        }

        /* 强调色用于进度条和选中文本 */
        .accent-color {
            color: #0a84ff;
        }
        .bg-accent {
            background-color: #0a84ff;
        }

        /* 反馈区域的左侧边框（由 Tailwind 的 border-l-4 实现） */
        .feedback {
            border-left-width: 4px;
            border-left-color: #0a84ff;
        }
        .feedback.success {
            border-left-color: #30d158;
        }
        .feedback.error {
            border-left-color: #ff453a;
        }
    </style>
</head>
<body>

    <!-- 主容器：背景最深色，内容居中 -->
    <div class="min-h-screen bg-[#1c1c1e] text-white/95 p-4 md:p-6 flex flex-col items-center">
        <div class="w-full max-w-6xl">

            <!-- 头部 -->
            <header class="flex flex-wrap items-center justify-between gap-4 mb-8 pb-4 border-b border-white/8">
                <div>
                    <h1 class="font-serif text-2xl md:text-3xl font-semibold text-white/95 tracking-tight">
                        🧪 UI 测试面板
                    </h1>
                    <p class="text-white/60 text-sm mt-1">macOS 毛玻璃风格 · 暗色桌面体验</p>
                </div>
                <!-- 此处不提供主题切换，保持纯暗色 -->
                <div class="text-white/40 text-xs flex items-center gap-2">
                    <span class="inline-block w-2 h-2 rounded-full bg-accent"></span>
                    系统强调色 #0a84ff
                </div>
            </header>

            <!-- 卡片网格 第一行 (三列) -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">

                <!-- 卡片 1: 按钮交互 -->
                <div class="bg-[#2c2c2e] border border-white/8 rounded-xl p-4 md:p-5 shadow-[0_1px_0_rgba(255,255,255,0.05)]">
                    <h3 class="font-serif text-lg md:text-xl font-semibold text-white/95 mb-1">🔘 按钮交互</h3>
                    <p class="text-white/60 text-sm mb-4">点击按钮触发反馈</p>
                    <div class="flex flex-wrap gap-2">
                        <button id="clickBtn" class="bg-[#3a3a3c] text-white/90 rounded-lg px-4 py-2 text-sm font-medium hover:bg-white/10 transition-colors duration-200">
                            点击我
                        </button>
                        <button id="resetBtn" class="bg-transparent text-white/70 rounded-lg px-4 py-2 text-sm font-medium border border-white/10 hover:bg-white/5 transition-colors duration-200">
                            重置
                        </button>
                        <button id="errorBtn" class="bg-transparent text-white/70 rounded-lg px-4 py-2 text-sm font-medium border border-white/10 hover:bg-white/5 transition-colors duration-200">
                            ❌ 出错
                        </button>
                    </div>
                    <div id="feedbackMessage" class="feedback bg-[#1c1c1e] rounded-lg px-4 py-3 mt-4 text-sm text-white/80 min-h-[3rem] border border-white/5">
                        等待操作…
                    </div>
                </div>

                <!-- 卡片 2: 表单元素 (含优化下拉框) -->
                <div class="bg-[#2c2c2e] border border-white/8 rounded-xl p-4 md:p-5 shadow-[0_1px_0_rgba(255,255,255,0.05)]">
                    <h3 class="font-serif text-lg md:text-xl font-semibold text-white/95 mb-1">📝 表单元素</h3>
                    <p class="text-white/60 text-sm mb-4">输入框、下拉选择</p>
                    <div class="space-y-3">
                        <div>
                            <label for="nameInput" class="block text-white/70 text-xs font-medium mb-1">姓名</label>
                            <input type="text" id="nameInput" placeholder="例如：张三"
                                   class="w-full bg-[#1c1c1e] border border-white/10 rounded-lg px-3 py-2 text-sm text-white/90 placeholder-white/30 focus:outline-none focus:border-white/25 transition-colors duration-200" />
                        </div>
                        <div>
                            <label for="emailInput" class="block text-white/70 text-xs font-medium mb-1">邮箱</label>
                            <input type="email" id="emailInput" placeholder="example@mail.com"
                                   class="w-full bg-[#1c1c1e] border border-white/10 rounded-lg px-3 py-2 text-sm text-white/90 placeholder-white/30 focus:outline-none focus:border-white/25 transition-colors duration-200" />
                        </div>
                        <div>
                            <label for="roleSelect" class="block text-white/70 text-xs font-medium mb-1">角色</label>
                            <select id="roleSelect"
                                    class="w-full bg-[#1c1c1e] border border-white/10 rounded-lg px-3 py-2 text-sm text-white/90 focus:outline-none focus:border-white/25 transition-colors duration-200 appearance-none">
                                <option value="" disabled selected>-- 请选择 --</option>
                                <option value="user">普通用户</option>
                                <option value="admin">管理员</option>
                                <option value="guest">访客</option>
                            </select>
                            <div class="text-white/50 text-xs mt-1 flex items-center gap-1">
                                👉 当前选择：<span id="selectedRoleDisplay" class="text-white/90 font-medium">无</span>
                            </div>
                        </div>
                        <button id="submitFormBtn" class="bg-[#3a3a3c] text-white/90 rounded-lg px-4 py-2 text-sm font-medium hover:bg-white/10 transition-colors duration-200 w-full">
                            提交表单
                        </button>
                        <div id="formFeedback" class="feedback bg-[#1c1c1e] rounded-lg px-4 py-3 text-sm text-white/80 min-h-[3rem] border border-white/5">
                            填写后点击提交
                        </div>
                    </div>
                </div>

                <!-- 卡片 3: 视觉元素 (颜色样本 + 进度条) -->
                <div class="bg-[#2c2c2e] border border-white/8 rounded-xl p-4 md:p-5 shadow-[0_1px_0_rgba(255,255,255,0.05)]">
                    <h3 class="font-serif text-lg md:text-xl font-semibold text-white/95 mb-1">🎨 视觉元素</h3>
                    <p class="text-white/60 text-sm mb-4">颜色样本与进度条</p>
                    <div class="flex gap-2 flex-wrap mb-3">
                        <span class="w-8 h-8 rounded-lg border border-white/10" style="background:#0a84ff;"></span>
                        <span class="w-8 h-8 rounded-lg border border-white/10" style="background:#30d158;"></span>
                        <span class="w-8 h-8 rounded-lg border border-white/10" style="background:#ff453a;"></span>
                        <span class="w-8 h-8 rounded-lg border border-white/10" style="background:#ffd60a;"></span>
                        <span class="w-8 h-8 rounded-lg border border-white/10" style="background:#bf5af2;"></span>
                    </div>
                    <div>
                        <div class="flex justify-between text-white/50 text-xs mb-1">
                            <span>下载进度</span>
                            <span id="progressLabel">30%</span>
                        </div>
                        <div class="w-full h-1.5 bg-[#1c1c1e] rounded-full overflow-hidden">
                            <div id="progressFill" class="h-full bg-accent rounded-full transition-all duration-200 ease-out" style="width:30%;"></div>
                        </div>
                        <div class="flex gap-2 mt-3">
                            <button id="progressBtn" class="bg-[#3a3a3c] text-white/90 rounded-lg px-3 py-1.5 text-xs font-medium hover:bg-white/10 transition-colors duration-200 flex-1">
                                ▶ 增加
                            </button>
                            <button id="resetProgressBtn" class="bg-transparent text-white/70 rounded-lg px-3 py-1.5 text-xs font-medium border border-white/10 hover:bg-white/5 transition-colors duration-200 flex-1">
                                ↺ 重置
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 卡片网格 第二行 (两列) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 mt-4 md:mt-6">
                <!-- 卡片 4: 列表与徽章 -->
                <div class="bg-[#2c2c2e] border border-white/8 rounded-xl p-4 md:p-5 shadow-[0_1px_0_rgba(255,255,255,0.05)]">
                    <h3 class="font-serif text-lg md:text-xl font-semibold text-white/95 mb-1">📦 卡片内容</h3>
                    <p class="text-white/60 text-sm mb-3">列表样式与状态标签</p>
                    <ul class="card-list space-y-1.5 pl-1">
                        <li>• 响应式网格布局</li>
                        <li>• 暗色主题适配</li>
                        <li>• 1px 半透明边框</li>
                    </ul>
                    <span class="inline-block mt-3 bg-[#3a3a3c] text-white/80 text-[0.65rem] font-medium px-3 py-0.5 rounded-full border border-white/5">
                        测试中
                    </span>
                </div>

                <!-- 卡片 5: 状态切换 -->
                <div class="bg-[#2c2c2e] border border-white/8 rounded-xl p-4 md:p-5 shadow-[0_1px_0_rgba(255,255,255,0.05)]">
                    <h3 class="font-serif text-lg md:text-xl font-semibold text-white/95 mb-1">🔄 状态切换</h3>
                    <p class="text-white/60 text-sm mb-4">点击切换模拟状态</p>
                    <button id="toggleStateBtn" class="bg-[#3a3a3c] text-white/90 rounded-lg px-4 py-2 text-sm font-medium hover:bg-white/10 transition-colors duration-200">
                        切换状态
                    </button>
                    <div id="stateFeedback" class="feedback bg-[#1c1c1e] rounded-lg px-4 py-3 mt-4 text-sm text-white/80 min-h-[3rem] border border-white/5">
                        当前状态：正常
                    </div>
                </div>
            </div>

            <!-- 页脚 -->
            <footer class="mt-12 pt-6 border-t border-white/8 text-white/40 text-xs text-center">
                <p>UI 测试 · macOS 毛玻璃风格 · 部署于 GitHub Pages · 2026</p>
            </footer>

        </div>
    </div>

    <!-- JavaScript 交互逻辑 -->
    <script>
        (function() {
            "use strict";

            // DOM 元素
            const feedback = document.getElementById('feedbackMessage');
            const clickBtn = document.getElementById('clickBtn');
            const resetBtn = document.getElementById('resetBtn');
            const errorBtn = document.getElementById('errorBtn');

            const formFeedback = document.getElementById('formFeedback');
            const submitFormBtn = document.getElementById('submitFormBtn');
            const nameInput = document.getElementById('nameInput');
            const emailInput = document.getElementById('emailInput');
            const roleSelect = document.getElementById('roleSelect');
            const selectedRoleDisplay = document.getElementById('selectedRoleDisplay');

            const progressFill = document.getElementById('progressFill');
            const progressLabel = document.getElementById('progressLabel');
            const progressBtn = document.getElementById('progressBtn');
            const resetProgressBtn = document.getElementById('resetProgressBtn');

            const toggleStateBtn = document.getElementById('toggleStateBtn');
            const stateFeedback = document.getElementById('stateFeedback');

            // ---------- 按钮交互 ----------
            const setFeedback = (msg, type = '') => {
                feedback.textContent = msg;
                feedback.className = 'feedback bg-[#1c1c1e] rounded-lg px-4 py-3 text-sm text-white/80 min-h-[3rem] border border-white/5' + (type ? ' ' + type : '');
            };

            clickBtn.addEventListener('click', () => {
                setFeedback('✅ 按钮被点击！当前时间：' + new Date().toLocaleTimeString(), 'success');
            });

            resetBtn.addEventListener('click', () => {
                setFeedback('🔄 已重置反馈信息', '');
            });

            errorBtn.addEventListener('click', () => {
                setFeedback('❌ 模拟错误：发生了异常情况', 'error');
            });

            // ---------- 下拉框实时显示 ----------
            roleSelect.addEventListener('change', function() {
                if (this.value) {
                    selectedRoleDisplay.textContent = this.options[this.selectedIndex].text;
                } else {
                    selectedRoleDisplay.textContent = '无';
                }
            });

            // ---------- 表单提交（含校验） ----------
            submitFormBtn.addEventListener('click', () => {
                const name = nameInput.value.trim() || '未填写';
                const email = emailInput.value.trim() || '未填写';
                const roleValue = roleSelect.value;

                if (!roleValue) {
                    formFeedback.textContent = '⚠️ 请先选择一个角色！';
                    formFeedback.className = 'feedback bg-[#1c1c1e] rounded-lg px-4 py-3 text-sm text-white/80 min-h-[3rem] border border-white/5 error';
                    return;
                }

                const roleText = roleSelect.options[roleSelect.selectedIndex].text;
                formFeedback.textContent = `📋 提交成功：${name} (${roleText})，邮箱 ${email}`;
                formFeedback.className = 'feedback bg-[#1c1c1e] rounded-lg px-4 py-3 text-sm text-white/80 min-h-[3rem] border border-white/5 success';
            });

            // 输入时重置反馈样式（辅助）
            [nameInput, emailInput].forEach(el => {
                el.addEventListener('input', () => {
                    formFeedback.className = 'feedback bg-[#1c1c1e] rounded-lg px-4 py-3 text-sm text-white/80 min-h-[3rem] border border-white/5';
                });
            });

            // ---------- 进度条 ----------
            let progress = 30;
            const updateProgress = (value) => {
                progress = Math.min(100, Math.max(0, value));
                progressFill.style.width = progress + '%';
                progressLabel.textContent = progress + '%';
                if (progress >= 100) {
                    progressFill.style.background = '#30d158'; // 完成绿色
                } else {
                    progressFill.style.background = '#0a84ff';
                }
            };

            progressBtn.addEventListener('click', () => {
                updateProgress(progress + 15);
            });

            resetProgressBtn.addEventListener('click', () => {
                updateProgress(0);
            });

            // ---------- 状态切换 ----------
            let stateIndex = 0;
            const states = ['正常', '加载中', '已完成', '暂停'];
            toggleStateBtn.addEventListener('click', () => {
                stateIndex = (stateIndex + 1) % states.length;
                const s = states[stateIndex];
                stateFeedback.textContent = '当前状态：' + s;
                stateFeedback.className = 'feedback bg-[#1c1c1e] rounded-lg px-4 py-3 text-sm text-white/80 min-h-[3rem] border border-white/5';
                if (s === '已完成') {
                    stateFeedback.classList.add('success');
                } else if (s === '暂停') {
                    stateFeedback.classList.add('error');
                }
                // 加载中或正常只保留基础样式
            });

            // 初始化进度显示
            updateProgress(30);

            console.log('macOS 毛玻璃 UI 测试已加载。');
        })();
    </script>
</body>
</html>
