<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>路由器控制台</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f0f0f0; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto; }
        #status { font-weight: bold; margin: 10px 0; }
        .online { color: #4caf50; }
        .offline { color: #f44336; }
        iframe { width: 100%; height: 600px; border: 1px solid #ccc; border-radius: 4px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>YK-L1 远程控制台</h2>
        <div id="status">正在读取状态...</div>
        
        <!-- 默认隐藏 iframe -->
        <iframe id="router-frame" style="display:none;" src="about:blank"></iframe>
    </div>

    <script>
        async function checkRouter() {
            try {
                // ⚠️ 替换成你自己的 Gist Raw 链接
                const res = await fetch('https://gist.githubusercontent.com/Ksbyqwq/f790a851dcc76183519561bdc1a79301/raw/tunnel.json');
                const data = await res.json();
                
                const statusDiv = document.getElementById('status');
                const iframe = document.getElementById('router-frame');

                // 判断状态
                if (data.status === 'offline' || !data.url) {
                    statusDiv.innerText = "🔴 路由器已离线 (隧道已关闭)";
                    statusDiv.className = "offline";
                    iframe.style.display = "none";
                } else {
                    statusDiv.innerText = "🟢 连接成功，隧道地址: " + data.url;
                    statusDiv.className = "online";
                    iframe.src = data.url;
                    iframe.style.display = "block";
                }
            } catch (e) {
                document.getElementById('status').innerText = "⚠️ 无法读取 Gist 数据：" + e;
                document.getElementById('status').className = "offline";
            }
        }
        checkRouter();
    </script>
</body>
</html>
