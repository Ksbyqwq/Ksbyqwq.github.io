<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>路由器控制台</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        iframe { width: 90%; height: 80vh; border: 2px solid #ccc; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>YK-L1 远程控制台</h2>
    <p id="status">正在连接路由器...</p>
    
    <!-- 用一个 iframe 直接把路由器后台嵌进来 -->
    <iframe id="router-frame" src="about:blank" style="display:none;"></iframe>

    <script>
        async function loadRouter() {
            try {
                // ⚠️ 把这里的 URL 换成你 Gist 的 raw 链接！
                // 格式大概是：https://gist.githubusercontent.com/Ksbyqwq/f790a851dcc76183519561bdc1a79301/raw/tunnel.json
                const res = await fetch('https://gist.githubusercontent.com/Ksbyqwq/f790a851dcc76183519561bdc1a79301/raw/tunnel.json');
                const data = await res.json();
                const routerUrl = data.url;

                document.getElementById('status').innerText = "连接成功，隧道地址: " + routerUrl;
                
                const iframe = document.getElementById('router-frame');
                iframe.src = routerUrl;
                iframe.style.display = 'inline-block';
            } catch (e) {
                document.getElementById('status').innerText = "连接失败：" + e;
            }
        }
        loadRouter();
    </script>
</body>
</html>
