<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mystic AI</title>
<style>
:root{--bg:#0a0e1a;--surface:#111627;--text:#e4e4e7;--text2:#6b7280;--text3:#4b5563;--primary:#3399ff;--primary-hover:#1a7fe0;--primary-bg:#0d2245;--border:#1e2235;--success:#4ade80;--danger:#f87171;--warning:#fbbf24;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFangSC-Regular",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.header{position:sticky;top:0;background:rgba(10,14,26,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 16px;z-index:50;display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.header-title .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 2s infinite}
.header-title .dot.online{background:var(--success);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.header-status{font-size:12px;color:var(--text2)}
#chat{flex:1;overflow-y:auto;padding:16px;padding-bottom:80px;-webkit-overflow-scrolling:touch}
.msg{margin-bottom:14px;display:flex;flex-direction:column;max-width:88%;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end}
.msg.assistant{align-self:flex-start}
.msg-bubble{padding:12px 16px;border-radius:var(--radius);font-size:14px;line-height:1.65;word-break:break-word;white-space:pre-wrap}
.msg.user .msg-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.assistant .msg-bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-time{font-size:10px;color:var(--text3);margin-top:4px;padding:0 4px}
.msg.user .msg-time{text-align:right}
.typing{display:flex;gap:4px;padding:12px 16px}
.typing span{width:6px;height:6px;background:var(--text3);border-radius:50%;animation:typing 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.input-wrap{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,26,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:50}
.input-wrap input{flex:1;padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;outline:none;-webkit-appearance:none}
.input-wrap input:focus{border-color:var(--primary)}
.input-wrap input:disabled{opacity:.5}
.input-wrap button{padding:12px 18px;border-radius:10px;border:none;background:var(--primary);color:#fff;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.input-wrap button:active{background:var(--primary-hover);transform:scale(.97)}
.input-wrap button:disabled{opacity:.5;cursor:not-allowed}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:380px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{font-size:18px;margin-bottom:8px}
.modal p{color:var(--text2);font-size:13px;margin-bottom:16px;line-height:1.5}
.modal input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;margin-bottom:12px;-webkit-appearance:none}
.modal input:focus{border-color:var(--primary)}
.modal .btn-row{display:flex;gap:8px;justify-content:flex-end}
.modal button{padding:10px 18px;border-radius:10px;border:none;font-size:14px;cursor:pointer}
.modal .btn-secondary{background:transparent;color:var(--text2);border:1px solid var(--border)}
.modal .btn-primary{background:var(--primary);color:#fff}
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.5}
pre{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;font-size:12px;line-height:1.5;margin:8px 0}
code{font-family:"SF Mono",Monaco,monospace;font-size:12px;background:rgba(255,255,255,.06);padding:2px 6px;border-radius:4px}
pre code{background:none;padding:0}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">
    <span id="status-dot" class="dot"></span>
    <span>Mystic AI</span>
  </div>
  <div class="header-status" id="status-text">连接中...</div>
</div>

<div id="chat">
  <div class="empty">
    <div class="empty-icon">🔮</div>
    <div>正在寻找后端服务...</div>
  </div>
</div>

<div class="input-wrap">
  <input id="msg-input" placeholder="输入消息..." disabled onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}">
  <button id="send-btn" onclick="send()" disabled>发送</button>
</div>

<div class="modal-overlay" id="conn-modal">
  <div class="modal">
    <h3>连接后端</h3>
    <p>无法自动发现后端地址，请手动输入当前隧道地址</p>
    <input id="manual-url" placeholder="https://xxx.trycloudflare.com/v1">
    <div class="btn-row">
      <button class="btn-secondary" onclick="retryAuto()">重试自动</button>
      <button class="btn-primary" onclick="manualConnect()">连接</button>
    </div>
  </div>
</div>

<script>
// ==================== 配置 ====================
// 从 Gist 读取后端地址，替换为你的 Gist ID
const GIST_ID = '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';

// 备用地址列表（按优先级）
const FALLBACKS = [
  'http://192.168.1.5:8787/v1',
  'http://127.0.0.1:8787/v1',
];

let BASE = null;
let messages = [{"role":"system","content":"You are a helpful assistant."}];
let isStreaming = false;

const chat = document.getElementById('chat');
const msgInput = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const connModal = document.getElementById('conn-modal');

async function init() {
  if (GIST_ID && GIST_ID !== 'YOUR_GIST_ID_HERE') {
    try {
      const resp = await fetch(`https://gist.githubusercontent.com/raw/${GIST_ID}/endpoint.txt?t=${Date.now()}`, {
        signal: AbortSignal.timeout(8000)
      });
      const url = (await resp.text()).trim();
      if (url && !url.includes('placeholder') && await testBackend(url)) {
        setConnected(url);
        return;
      }
    } catch(e) {}
  }
  for (const url of FALLBACKS) {
    if (await testBackend(url)) {
      setConnected(url);
      return;
    }
  }
  showModal();
}

async function testBackend(url) {
  try {
    const resp = await fetch(url.replace('/v1', '/v1/test'), {signal: AbortSignal.timeout(4000)});
    return resp.ok;
  } catch(e) { return false; }
}

function setConnected(url) {
  BASE = url;
  statusDot.classList.add('online');
  statusText.textContent = '已连接';
  statusText.style.color = 'var(--success)';
  msgInput.disabled = false;
  sendBtn.disabled = false;
  chat.innerHTML = '';
  appendAssistant('已连接到后端，可以开始对话了。');
  msgInput.focus();
}

function showModal() {
  connModal.classList.add('show');
  setTimeout(() => document.getElementById('manual-url').focus(), 100);
}
function hideModal() { connModal.classList.remove('show'); }
function retryAuto() { hideModal(); chat.innerHTML = '<div class="empty"><div class="empty-icon">🔄</div><div>重新尝试连接...</div></div>'; init(); }

function manualConnect() {
  const url = document.getElementById('manual-url').value.trim();
  if (!url) return;
  let finalUrl = url;
  if (!finalUrl.endsWith('/v1')) finalUrl += '/v1';
  testBackend(finalUrl).then(ok => {
    if (ok) { hideModal(); setConnected(finalUrl); }
    else { alert('无法连接到此地址，请确认后端已启动'); }
  });
}

function appendUser(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="msg-bubble">${escapeHtml(text)}</div><div class="msg-time">${fmtTime()}</div>`;
  chat.appendChild(div);
  scrollToBottom();
}

function appendAssistant(text) {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `<div class="msg-bubble">${formatText(text)}</div><div class="msg-time">${fmtTime()}</div>`;
  chat.appendChild(div);
  scrollToBottom();
  return div;
}

function appendTyping() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'typing-indicator';
  div.innerHTML = `<div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(div);
  scrollToBottom();
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function scrollToBottom() { chat.scrollTop = chat.scrollHeight; }
function fmtTime() {
  const d = new Date();
  return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatText(text) {
  let html = escapeHtml(text);
  html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

async function send() {
  if (isStreaming) return;
  const text = msgInput.value.trim();
  if (!text || !BASE) return;

  msgInput.value = '';
  msgInput.disabled = true;
  sendBtn.disabled = true;
  isStreaming = true;

  appendUser(text);
  messages.push({role: 'user', content: text});
  appendTyping();

  let assistantDiv = null;
  let fullText = '';

  try {
    const resp = await fetch(BASE + '/chat/completions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({model: 'mystic-ai', messages: messages, stream: true})
    });
    if (!resp.ok) throw new Error('后端响应异常: ' + resp.status);

    removeTyping();
    assistantDiv = appendAssistant('');
    const bubble = assistantDiv.querySelector('.msg-bubble');

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, {stream: true});
      for (const line of chunk.split('\n')) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const data = trimmed.slice(5).trim();
        if (data === '[DONE]') break;
        try {
          const json = JSON.parse(data);
          const content = json.choices?.[0]?.delta?.content;
          if (content) {
            fullText += content;
            bubble.innerHTML = formatText(fullText);
            scrollToBottom();
          }
        } catch(e) {}
      }
    }
    messages.push({role: 'assistant', content: fullText});
  } catch (e) {
    removeTyping();
    if (assistantDiv) {
      assistantDiv.querySelector('.msg-bubble').innerHTML = `<span style="color:var(--danger)">错误: ${escapeHtml(e.message)}</span>`;
    } else {
      appendAssistant(`错误: ${e.message}`);
    }
  }

  isStreaming = false;
  msgInput.disabled = false;
  sendBtn.disabled = false;
  msgInput.focus();
}

init();
</script>
</body>
</html>
